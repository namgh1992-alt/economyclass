<script>
(() => {
  const { useState, useEffect, useMemo, useRef } = React;
  const KEY = "class-econ-v1";
  const roomKey = (code) => `class-econ-room:${code}`;
  const makeCode = () => {
    const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    return Array.from({ length: 6 }, () => A[Math.floor(Math.random() * A.length)]).join("");
  };
  const blankFrom = (d) => {
    const b = DEFAULT();
    return {
      ...b,
      titles: JSON.parse(JSON.stringify(d.titles || b.titles)),
      jobs: JSON.parse(JSON.stringify(d.jobs || b.jobs)),
      diliItems: JSON.parse(JSON.stringify(d.diliItems || b.diliItems)),
      settings: { ...b.settings, ...d.settings || {} },
      bank: { rates: JSON.parse(JSON.stringify((d.bank || b.bank).rates)), accounts: [] }
    };
  };
  const pad = (n) => String(n).padStart(2, "0");
  const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  };
  const mondayOf = (d) => {
    const x = new Date(d);
    const w = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - w);
    x.setHours(0, 0, 0, 0);
    return x;
  };
  const addDays = (d, n) => {
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  };
  const won = (n) => Math.round(Number(n) || 0).toLocaleString("ko-KR");
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  const DAYS = ["월", "화", "수", "목", "금"];
  const readPhoto = (file, size = 260) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const c = document.createElement("canvas");
        c.width = size;
        c.height = size;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        res(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = () => rej(new Error("이미지를 읽지 못했습니다."));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error("파일을 읽지 못했습니다."));
    fr.readAsDataURL(file);
  });
  const numify = (v) => {
    const s = String(v).replace(/[^0-9-]/g, "");
    return s === "" || s === "-" ? 0 : Number(s);
  };
  const TITLE_COLORS = [
    { bg: "#FFE7EC", bd: "#F2A9BA", fg: "#B22A4E" },
    { bg: "#FFEEDA", bd: "#F0C084", fg: "#A85C0B" },
    { bg: "#FCF6CE", bd: "#E3CC5E", fg: "#846309" },
    { bg: "#E1F5D9", bd: "#A3D48F", fg: "#347025" },
    { bg: "#D9F0F4", bd: "#8FCCD8", fg: "#0F6373" },
    { bg: "#E0E9FC", bd: "#A5B9F0", fg: "#2A4699" },
    { bg: "#EEE4FB", bd: "#C4A9EA", fg: "#63359E" },
    { bg: "#FCE3F1", bd: "#EBA8D2", fg: "#9C2C7C" }
  ];
  const titleColor = (t, i) => TITLE_COLORS[((t && typeof t.ci === "number" ? t.ci : i) % TITLE_COLORS.length + TITLE_COLORS.length) % TITLE_COLORS.length];
  const DEFAULT = () => ({
    students: [],
    titles: ["성실왕", "저축왕", "발표왕", "나눔천사", "정리요정", "독서왕"].map((l, i) => ({ id: uid(), label: l, ci: i })),
    jobs: [
      { id: uid(), name: "은행원", wage: 1500 },
      { id: uid(), name: "기자", wage: 1200 },
      { id: uid(), name: "환경미화원", wage: 1e3 }
    ],
    diliItems: [
      { id: "notice", label: "알림장", emoji: "\u{1F4D2}", amount: 200 },
      { id: "book", label: "독서노트", emoji: "\u{1F4D6}", amount: 300 }
    ],
    treasury: [],
    donations: [],
    laws: [],
    perms: {},
    market: { bonds: [], stocks: [] },
    holdings: {},
    realized: [],
    trades: [],
    bank: {
      rates: { saving: { 2: 5, 3: 8, 4: 12 }, deposit: { 2: 3, 3: 5, 4: 8 } },
      accounts: []
    },
    meta: {},
    tx: [],
    weeks: {},
    ai: {},
    settings: { dailyPrize: 300, praisePrize: 200, mealPlus: 200, mealMinus: 300, taxRate: 20 }
  });
  const migrate = (d) => {
    const b = DEFAULT();
    const out = { ...b, ...d };
    out.settings = { ...b.settings, ...d.settings || {} };
    out.bank = { ...b.bank, ...d.bank || {} };
    out.bank.rates = { ...b.bank.rates, ...(d.bank || {}).rates || {} };
    out.bank.accounts = (d.bank || {}).accounts || [];
    out.treasury = d.treasury || [];
    out.donations = d.donations || [];
    out.laws = d.laws || [];
    out.perms = d.perms || {};
    out.market = { bonds: (d.market || {}).bonds || [], stocks: (d.market || {}).stocks || [] };
    out.holdings = d.holdings || {};
    out.realized = d.realized || [];
    out.trades = d.trades || [];
    out.ai = d.ai || {};
    if (!d.diliItems) {
      out.diliItems = [
        { id: "notice", label: "알림장", emoji: "\u{1F4D2}", amount: (d.settings || {}).noticePrize ?? 200 },
        { id: "book", label: "독서노트", emoji: "\u{1F4D6}", amount: (d.settings || {}).bookPrize ?? 300 }
      ];
    }
    return out;
  };
  const EMPTY_WEEK = () => ({ claps: {}, praise: {}, dili: {}, mealChk: {}, menu: ["", "", "", "", ""], prizes: {}, meal: {}, etc: {}, paid: false, paidAt: null });
  const getWeek = (data, k) => {
    const w = data.weeks[k] || EMPTY_WEEK();
    return { ...EMPTY_WEEK(), ...w };
  };
  const ensureWeek = (draft, k) => {
    if (!draft.weeks[k]) draft.weeks[k] = EMPTY_WEEK();
    const w = draft.weeks[k];
    ["claps", "praise", "dili", "mealChk", "prizes", "meal", "etc"].forEach((f) => {
      if (!w[f]) w[f] = {};
    });
    if (!Array.isArray(w.menu)) w.menu = ["", "", "", "", ""];
    return w;
  };
  const getMeta = (data, sid) => data.meta[sid] || { titleIds: [], jobId: null, savings: 0, stocks: 0, bonds: 0, photo: null };
  const ensureMeta = (draft, sid) => {
    if (!draft.meta[sid]) draft.meta[sid] = { titleIds: [], jobId: null, savings: 0, stocks: 0, bonds: 0, photo: null };
    return draft.meta[sid];
  };
  const presentScore = (w, sid, st) => {
    const c = w.claps[sid] || [0, 0, 0, 0, 0];
    const p = w.praise[sid] || [0, 0, 0, 0, 0];
    const full = c.filter((v) => v >= 3).length;
    const thumbs = p.reduce((a, b) => a + b, 0);
    return full * (Number(st.dailyPrize) || 0) + thumbs * (Number(st.praisePrize) || 0);
  };
  const diliScore = (w, sid, data) => {
    const d = w.dili[sid] || {};
    return (data.diliItems || []).reduce((s, it) => {
      const arr = d[it.id] || [];
      return s + arr.filter(Boolean).length * (Number(it.amount) || 0);
    }, 0);
  };
  const mealScore = (w, sid, st) => {
    const m = w.mealChk[sid] || {};
    const g = (m.good || []).filter(Boolean).length;
    const b = (m.bad || []).filter(Boolean).length;
    return g * (Number(st.mealPlus) || 0) - b * (Number(st.mealMinus) || 0);
  };
  const rowSum = (r) => r.vals.reduce((a, b) => a + (Number(b) || 0), 0);
  const prizeNet = (w, sid) => (w.prizes[sid] || []).reduce((s, r) => s + (r.kind === "세금" ? -rowSum(r) : rowSum(r)), 0);
  const prizeTax = (w, sid) => (w.prizes[sid] || []).reduce((s, r) => s + (r.kind === "세금" ? rowSum(r) : 0), 0);
  const calcPay = (data, k, sid) => {
    const w = getWeek(data, k);
    const m = getMeta(data, sid);
    const job = data.jobs.find((j) => j.id === m.jobId) || null;
    const wage = job ? Number(job.wage) || 0 : 0;
    const pres = presentScore(w, sid, data.settings);
    const dili = diliScore(w, sid, data);
    const prize = prizeNet(w, sid);
    const meal = mealScore(w, sid, data.settings);
    const etc = Number(w.etc[sid]) || 0;
    const gross = wage + pres + dili + prize + meal + etc;
    const tax = Math.round(Math.max(0, gross) * ((Number(data.settings.taxRate) || 0) / 100));
    return { job, wage, tax, pres, dili, prize, meal, etc, gross, total: gross - tax };
  };
  const addWeeks = (wkey, n) => toKey(addDays(parseKey(wkey), n * 7));
  const acctPrincipal = (a) => a.type === "saving" ? (Number(a.amount) || 0) * a.term : Number(a.amount) || 0;
  const acctInterest = (a) => Math.round(acctPrincipal(a) * (Number(a.rate) || 0) / 100);
  const startOf = (a) => a.startDate || a.startWeek;
  const payDate = (a, i) => toKey(addDays(parseKey(startOf(a)), 7 * i));
  const maturityWeek = (a) => toKey(addDays(parseKey(startOf(a)), 7 * a.term));
  const paidList = (a) => a.paidDates || a.paidWeeks || [];
  const acctBalance = (a, date) => {
    if (a.matured && maturityWeek(a) <= date) return 0;
    if (startOf(a) > date) return 0;
    const amt = Number(a.amount) || 0;
    return a.type === "saving" ? amt * paidList(a).filter((d) => d <= date).length : amt;
  };
  const bankHolding = (data, sid) => {
    const today = toKey(new Date());
    return (data.bank.accounts || []).filter((a) => a.sid === sid).reduce((s, a) => s + acctBalance(a, today), 0);
  };
  const KINDS = { bonds: { label: "채권", unit: "좌" }, stocks: { label: "주식", unit: "주" } };
  const holdingOf = (data, sid, aid) => (data.holdings || {})[sid]?.[aid] || { qty: 0, avg: 0 };
  const portfolio = (data, sid, kind, wkey) => {
    let value = 0;
    let cost = 0;
    (data.market[kind] || []).forEach((a) => {
      const h = holdingOf(data, sid, a.id);
      value += h.qty * (Number(a.price) || 0);
      cost += h.qty * (Number(h.avg) || 0);
    });
    const realized = realizedOf(data, sid, kind, wkey);
    return { value, cost, unreal: value - cost, realized, profit: value - cost + realized };
  };
  const ownersOf = (data, aid) => Object.entries(data.holdings || {}).filter(([, m]) => (m[aid]?.qty || 0) > 0).map(([sid, m]) => ({ sid, qty: m[aid].qty }));
  const valuation = (a) => {
    const fins = (a.fins || []).slice().sort((x, y) => x.wkey < y.wkey ? -1 : 1);
    const profitOf = (f) => (Number(f.revenue) || 0) - (Number(f.cost) || 0);
    const cumProfit = fins.reduce((s, f) => s + profitOf(f), 0);
    const payouts = a.payouts || [];
    const incl = new Set(fins.flatMap((f) => f.payIds || []));
    const paidOut = payouts.filter((p) => !incl.has(p.id)).reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const capital = (Number(a.qty) || 0) * (Number(a.face) || 0);
    const equity = capital + cumProfit - paidOut;
    const last = fins[fins.length - 1] || null;
    const lastProfit = last ? profitOf(last) : 0;
    const qty = Number(a.qty) || 1;
    const eps = lastProfit / qty;
    const bps = equity / qty;
    const cap = qty * (Number(a.price) || 0);
    return {
      fins,
      profitOf,
      cumProfit,
      payouts,
      paidOut,
      capital,
      equity,
      last,
      lastProfit,
      eps,
      bps,
      cap,
      per: eps > 0 ? (Number(a.price) || 0) / eps : null,
      pbr: bps > 0 ? (Number(a.price) || 0) / bps : null
    };
  };
  const fx = (v) => v === null || !isFinite(v) ? "—" : v.toFixed(2);
  const ensureHist = (a) => {
    const today = toKey(new Date());
    if (!a.history || !a.history.length) a.history = [{ date: today, price: a.price }];
    let last = a.history[a.history.length - 1];
    let guard = 0;
    while (last.date < today && guard++ < 400) {
      const d = addDays(parseKey(last.date), 1);
      a.history.push({ date: toKey(d), price: a.price });
      last = a.history[a.history.length - 1];
    }
    a.history[a.history.length - 1].price = a.price;
    if (a.history.length > 400) a.history = a.history.slice(-400);
  };
  const MARKET_ACTORS = { gov: "국세청", bank: "은행" };
  const actorName = (data, sid) => MARKET_ACTORS[sid] || data.students.find((s) => s.id === sid)?.name || "―";
  const usesCash = (sid) => sid !== "gov" && sid !== "bank";
  const realizedOf = (data, sid, kind, wkey) => (data.realized || []).filter((r) => r.sid === sid && r.kind === kind && (!wkey || r.wkey === wkey)).reduce((s, r) => s + r.amount, 0);
  const qtyAsOf = (data, sid, aid, date) => {
    let q = holdingOf(data, sid, aid).qty;
    (data.trades || []).filter((t) => t.sid === sid && t.aid === aid && t.date > date).forEach((t) => {
      q += t.side === "buy" ? -t.qty : t.qty;
    });
    return Math.max(0, q);
  };
  const priceAsOf = (a, date) => {
    const h = (a.history || []).filter((x) => x.date <= date);
    if (h.length) return h[h.length - 1].price;
    return (a.history || [])[0]?.price ?? a.price;
  };
  const bankHoldingAsOf = (data, sid, date) => (data.bank.accounts || []).filter((a) => a.sid === sid).reduce((s, a) => s + acctBalance(a, date), 0);
  const totalAssetsAsOf = (data, sid, date) => {
    const bank = data.tx.filter((t) => t.sid === sid && t.date <= date).reduce((s, t) => s + (t.type === "in" ? t.amount : -t.amount), 0);
    const m = getMeta(data, sid);
    let inv = 0;
    ["bonds", "stocks"].forEach(
      (k) => (data.market[k] || []).forEach((a) => {
        inv += qtyAsOf(data, sid, a.id, date) * priceAsOf(a, date);
      })
    );
    return bank + (Number(m.savings) || 0) + bankHoldingAsOf(data, sid, date) + inv;
  };
  const weekIncome = (data, sid, wk, curWk) => {
    const to = toKey(addDays(parseKey(wk), 6));
    const wtx = data.tx.filter((t) => t.sid === sid && t.date >= wk && t.date <= to);
    const dividend = wtx.filter((t) => t.type === "in" && /(채권 이자|배당금|성과급)/.test(t.memo || "")).reduce((a, t) => a + t.amount, 0);
    const bankInt = (data.bank.accounts || []).filter((a) => a.sid === sid && a.matured && maturityWeek(a) >= wk && maturityWeek(a) <= to).reduce((a, x) => a + acctInterest(x), 0);
    const gb = weekGain(data, sid, "bonds", wk);
    const gs = weekGain(data, sid, "stocks", wk);
    const paidTx = wtx.filter((t) => /주급 정산/.test(t.memo || ""));
    const labor = paidTx.length ? paidTx.reduce((a, t) => a + (t.type === "in" ? t.amount : -t.amount), 0) : wk === curWk ? calcPay(data, wk, sid).total : 0;
    return { dividend, bankInt, gb, gs, fin: dividend + bankInt + gb.total + gs.total, labor };
  };
  const schoolWeeks = (curWk) => {
    const now = parseKey(curWk);
    const y = now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear();
    let w = mondayOf(new Date(y, 2, 1));
    const out = [];
    let guard = 0;
    while (toKey(w) <= curWk && guard++ < 120) {
      out.push(toKey(w));
      w = addDays(w, 7);
    }
    return out.length ? out : [curWk];
  };
  const weekGain = (data, sid, kind, wkey) => {
    const today = toKey(new Date());
    const wEnd = toKey(addDays(parseKey(wkey), 6));
    const endD = wEnd < today ? wEnd : today;
    const prevD = toKey(addDays(parseKey(wkey), -1));
    if (endD < wkey) return { total: 0, buys: 0, sells: 0 };
    let hold = 0;
    (data.market[kind] || []).forEach((a) => {
      hold += qtyAsOf(data, sid, a.id, endD) * priceAsOf(a, endD) - qtyAsOf(data, sid, a.id, prevD) * priceAsOf(a, prevD);
    });
    let buys = 0;
    let sells = 0;
    (data.trades || []).filter((t) => t.sid === sid && t.kind === kind && t.date >= wkey && t.date <= endD).forEach((t) => {
      if (t.side === "buy") buys += t.amount;
      else sells += t.amount;
    });
    return { total: hold - buys + sells, buys, sells };
  };
  /* 선생님 가격(기준) + 전체 체결 내역의 수량 가중 평균
     주가 = (선생님 가격 × 발행 수량 + Σ 체결가×체결 수량) ÷ (발행 수량 + Σ 체결 수량) */
  const volOf = (a) => {
    if (a.vqty != null) return { sum: Number(a.vsum) || 0, qty: Number(a.vqty) || 0 };
    const t = a.trades || [];
    return { sum: t.reduce((x, r) => x + (Number(r.price) || 0) * (Number(r.qty) || 0), 0), qty: t.reduce((x, r) => x + (Number(r.qty) || 0), 0) };
  };
  const anchorW = (a) => Math.max(1, Number(a.qty) || 1);
  const blendPrice = (a, anchor, vol) => {
    const W = anchorW(a);
    const v = vol || volOf(a);
    return Math.max(1, Math.round((anchor * W + v.sum) / (W + v.qty)));
  };
  const execTrade = (n, a, kind, buyer, seller, qty, price) => {
    const amount = qty * price;
    const date = toKey(new Date());
    const wk = toKey(mondayOf(new Date()));
    if (!n.holdings) n.holdings = {};
    if (!n.realized) n.realized = [];
    if (!n.trades) n.trades = [];
    const logTrade = (sid, side) => n.trades.push({ id: uid(), sid, side, kind, aid: a.id, qty, price, amount, date, wkey: wk });
    if (buyer !== "gov") {
      if (usesCash(buyer))
        n.tx.push({ id: uid(), sid: buyer, date, type: "out", amount, memo: `${a.name} 매수 ${qty}${a.unit} @${won(price)}`, seq: Date.now() });
      if (!n.holdings[buyer]) n.holdings[buyer] = {};
      const h = n.holdings[buyer][a.id] || { qty: 0, avg: 0 };
      const nq = h.qty + qty;
      n.holdings[buyer][a.id] = { qty: nq, avg: nq ? Math.round((h.qty * h.avg + amount) / nq) : 0 };
      logTrade(buyer, "buy");
    }
    if (seller !== "gov") {
      if (usesCash(seller))
        n.tx.push({ id: uid(), sid: seller, date, type: "in", amount, memo: `${a.name} 매도 ${qty}${a.unit} @${won(price)}`, seq: Date.now() });
      if (!n.holdings[seller]) n.holdings[seller] = {};
      const h = n.holdings[seller][a.id] || { qty: 0, avg: 0 };
      const gain = qty * (price - (Number(h.avg) || 0));
      n.realized.push({ id: uid(), sid: seller, kind, wkey: wk, date, amount: gain, name: a.name, qty });
      n.holdings[seller][a.id] = { qty: Math.max(0, h.qty - qty), avg: h.avg };
      logTrade(seller, "sell");
    }
    const v0 = volOf(a);
    a.vsum = v0.sum + price * qty;
    a.vqty = v0.qty + qty;
    // 선생님이 가격을 정한 뒤에는 그 가격과 전체 체결 내역을 수량만큼 섞어 주가를 정한다
    a.price = Number(a.anchor) > 0 ? blendPrice(a, Number(a.anchor)) : price;
    a.trades = (a.trades || []).concat({ id: uid(), ts: Date.now(), date, price, qty, buyer, seller }).slice(-60);
    ensureHist(a);
  };
  const placeOrder = (n, kind, aid, order) => {
    const a = n.market[kind].find((x) => x.id === aid);
    if (!a) return;
    if (!a.orders) a.orders = [];
    let left = order.qty;
    const opp = a.orders.filter((o) => o.side !== order.side).sort((x, y) => order.side === "buy" ? x.price - y.price || x.ts - y.ts : y.price - x.price || x.ts - y.ts);
    for (const o of opp) {
      if (left <= 0) break;
      const cross = order.side === "buy" ? o.price <= order.price : o.price >= order.price;
      if (!cross) break;
      if (o.sid === order.sid) continue;
      const q = Math.min(left, o.qty);
      execTrade(n, a, kind, order.side === "buy" ? order.sid : o.sid, order.side === "buy" ? o.sid : order.sid, q, o.price);
      o.qty -= q;
      left -= q;
    }
    a.orders = a.orders.filter((o) => o.qty > 0);
    if (left > 0) a.orders.push({ id: uid(), side: order.side, sid: order.sid, qty: left, price: order.price, ts: Date.now() });
  };
  const CSS = `

/* ---- 주급 ---- */

  background:linear-gradient(180deg,#F5EAD0 25%,#B99A54 95%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ce .law-ttl p{margin:0;font-size:14.5px;color:#98A3B6;letter-spacing:1px;}
.ce .law-meta{margin-left:auto;display:flex;gap:20px;padding-right:6px;}
.ce .law-meta em{display:block;font-style:normal;font-size:12px;letter-spacing:2px;color:#8F9BB0;font-weight:700;}
.ce .law-meta b{font-size:22.5px;color:var(--lg);font-variant-numeric:tabular-nums;}
.ce .law-edit{position:relative;z-index:1;border:1px solid var(--lg);background:transparent;color:var(--lg);border-radius:2px;
  padding:9px 17px;font-size:14.5px;font-weight:800;letter-spacing:2px;cursor:pointer;font-family:inherit;}
.ce .law-edit:hover{background:var(--lg);color:#141C29;}
.ce .law-empty{margin-top:16px;padding:52px 20px;text-align:center;color:#6D6D6B;font-size:15.5px;line-height:1.9;
  background:#FCFCFA;border:1px solid var(--line);border-radius:4px;}
.ce .law-body{margin-top:16px;background:#FCFCFA;border:1px solid var(--line);border-radius:4px;
  padding:8px 0 0;box-shadow:0 1px 0 rgba(26,35,51,.05);}
.ce .law-ch{padding:16px 26px 20px;border-bottom:1px solid #EBEDE9;}
.ce .law-ch:last-of-type{border-bottom:0;}
.ce .law-ch-hd{border-bottom:2px solid #1A2333;padding-bottom:9px;margin-bottom:12px;}
.ce .law-no{display:inline-block;font-size:13px;letter-spacing:3px;font-weight:800;color:#B99A54;margin-bottom:3px;}
.ce .law-ch-hd h2{margin:0;font-size:20.5px;font-weight:800;color:#1A2333;letter-spacing:2px;}
.ce .law-ch-hd p{margin:5px 0 0;font-size:14.5px;color:#6E7684;letter-spacing:.4px;}
.ce .law-list{list-style:none;margin:0;padding:0;counter-reset:art;}
.ce .law-list li{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px dotted #DDE1DC;}
.ce .law-list li:last-child{border-bottom:0;}
.ce .law-list li:hover{background:#F7F8F5;}
.ce .law-art{flex:none;font-size:13.5px;font-weight:800;color:#8A93A2;letter-spacing:1.2px;min-width:56px;}
.ce .law-txt{flex:1;font-size:17px;line-height:1.7;color:#1F2733;letter-spacing:-.2px;font-weight:500;}
.ce .law-amts{display:flex;gap:8px;flex:none;justify-content:flex-end;align-items:stretch;}
.ce .law-amt{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:116px;
  padding:6px 13px 6px 12px;border-radius:3px;white-space:nowrap;position:relative;}
.ce .law-amt::before{content:"";position:absolute;right:0;top:5px;bottom:5px;width:2.5px;border-radius:2px;}
.ce .law-amt em{font-style:normal;font-size:12px;letter-spacing:2.2px;font-weight:800;opacity:.72;}
.ce .law-amt b{font-size:20.5px;font-weight:800;letter-spacing:-.6px;line-height:1.15;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.ce .law-amt i{font-style:normal;font-size:11.5px;letter-spacing:1.6px;font-weight:800;opacity:.55;margin-top:1px;}
.ce .law-amt.keep{background:linear-gradient(180deg,#F1F7F3,#E7F0EA);color:#14624A;}
.ce .law-amt.keep::before{background:#1B8A62;}
.ce .law-amt.brk{background:linear-gradient(180deg,#FBF1EF,#F5E5E2);color:#9A362D;}
.ce .law-amt.brk::before{background:#B7463A;}
.ce .law-none{font-size:14.5px;color:#9AA3AE;padding:6px 2px;}
.ce .law-seal{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:16px 26px 20px;border-top:1px solid #EBEDE9;
  font-size:14px;color:#7C8592;letter-spacing:2px;}
.ce .law-stamp{width:46px;height:46px;border:2px solid #B33B33;border-radius:5px;color:#B33B33;display:grid;place-items:center;
  font-size:23.5px;font-weight:800;transform:rotate(-9deg);opacity:.82;}
/* 편집 창 */
.ce .ed-ch{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:9px;background:#fff;}
.ce .ed-hd{display:flex;align-items:center;gap:8px;padding-bottom:7px;border-bottom:1px solid #EBEDE9;margin-bottom:7px;}
.ce .ed-title{border:0;font-size:16px;font-weight:800;flex:1;min-width:0;color:#1A2333;background:transparent;}
.ce .ed-title:focus{outline:0;border-bottom:1px solid #B99A54;}
.ce .ed-it{display:flex;align-items:center;gap:6px;padding:3px 0;}
.ce .ed-no{font-size:13px;font-weight:800;color:#9AA3AE;width:18px;flex:none;}
.ce .ed-txt{flex:1;min-width:0;border:1px solid var(--line2);border-radius:6px;padding:5px 7px;font-size:14.5px;}
.ce .ed-num{width:72px;flex:none;border:1px solid var(--line2);border-radius:6px;padding:5px 6px;font-size:14.5px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
.ce .ed-num.keep{color:#1B6B4F;}
.ce .ed-num.brk{color:#A33F35;}

@media(max-width:860px){
  .ce .law-cover{gap:12px;padding:17px;}
  .ce .law-ttl h1{font-size:23.5px;letter-spacing:3px;}
  .ce .law-meta{margin-left:0;}
  .ce .law-ch{padding:14px 16px 17px;}
  .ce .law-list li{flex-wrap:wrap;gap:8px;align-items:flex-start;}
  .ce .law-txt{width:calc(100% - 60px);}
  .ce .law-amts{width:100%;justify-content:flex-start;padding-left:60px;}
  .ce .law-amt{min-width:96px;}
}

/* ---- 자료 옮기기 ---- */
.ce .mover{margin-top:16px;}
.ce .mover-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border-top:1px solid var(--line2);}
.ce .mover-box{background:var(--card);padding:14px 16px;}
.ce .mover-t{font-size:13.5px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px;}
.ce .mover-box p{margin:0 0 9px;}
.ce .mover-btns{display:flex;gap:6px;flex-wrap:wrap;}
.ce .mover-found{padding:12px 16px;border-top:1px solid var(--line2);background:#F7F7F5;}
.ce .mover-hit{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;flex-wrap:wrap;}
.ce .mover-hit b{font-family:monospace;font-size:12.5px;color:var(--ink);}
.ce .mover-hit span{color:var(--mut);font-size:12.5px;}
.ce .mover-hit .btn{margin-left:auto;}
.ce .mover-msg{padding:9px 16px;border-top:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--in);background:#EDF5F1;}

/* ---- 교실 복사 배너 ---- */
.ce .rooms{margin-top:16px;border-radius:14px;overflow:hidden;background:linear-gradient(115deg,#121212,#1A1A1A 60%,#262626);border:1px solid #0E0E0E;color:#F2F2F0;}
.ce .rooms-l{display:flex;align-items:center;gap:14px;padding:16px 18px;flex-wrap:wrap;}
.ce .rooms-ic{font-size:29.7px;flex:none;}
.ce .rooms-t{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.ce .rooms-d{font-size:14.5px;color:#A9A9A6;line-height:1.65;max-width:520px;margin-top:2px;}
.ce .rooms-code{display:flex;align-items:center;gap:11px;padding:12px 18px;background:rgba(200,162,74,.13);border-top:1px solid rgba(200,162,74,.35);flex-wrap:wrap;}
.ce .rooms-lb{font-size:12.5px;letter-spacing:1.6px;color:#C9AD80;font-weight:800;}
.ce .rooms-num{font-size:26.5px;font-weight:800;color:var(--gold);letter-spacing:5px;font-variant-numeric:tabular-nums;}
.ce .rooms-code .hint{color:#A9A9A6;}
.ce .rooms-go{display:flex;align-items:center;gap:9px;padding:11px 18px;background:rgba(0,0,0,.16);border-top:1px solid #262626;flex-wrap:wrap;}
.ce .rooms-now{font-size:14.5px;color:#A9A9A6;margin-right:auto;}
.ce .rooms-now b{color:var(--gold);font-size:15px;margin-left:4px;}
.ce .roomtag{background:rgba(200,162,74,.18);border:1px solid rgba(200,162,74,.5);color:var(--gold);border-radius:20px;font-size:13.5px;font-weight:800;padding:3px 10px;letter-spacing:1px;}

/* ---- 학생 사진 ---- */
.ce .photo{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;margin:0 0 9px;background:#F0F0EE;border:1px solid var(--line2);}
.ce .photo img{width:100%;height:100%;object-fit:cover;display:block;}
.ce .photo-ov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:7px;opacity:0;transition:opacity .15s ease;background:linear-gradient(180deg,transparent 45%,rgba(10,30,26,.72));}
.ce .photo:hover .photo-ov{opacity:1;}
.ce .pbtn{border:0;background:rgba(255,255,255,.92);border-radius:7px;padding:4px 10px;font-size:14px;font-weight:800;cursor:pointer;color:var(--ink);}
.ce .pbtn:hover{background:#fff;}
.ce .pbtn.del{color:var(--out);}
.ce .photo-add{width:100%;height:100%;border:1px dashed var(--line);background:repeating-linear-gradient(45deg,#F0F0EE,#F0F0EE 7px,#F0F0EE 7px,#F0F0EE 14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#9A9A98;font-size:14px;font-weight:700;}
.ce .photo-add:hover{border-color:var(--gold);color:var(--gold-d);background:#EEF3F9;}
.ce .photo-add .pi{font-size:21.5px;line-height:1;font-weight:400;}
.ce .sbar-ph{width:38px;height:38px;border-radius:9px;object-fit:cover;border:1.5px solid rgba(200,162,74,.55);}

/* ---- 선택 학생 바 ---- */
.ce .sbar{display:flex;align-items:center;gap:10px;margin-top:16px;padding:11px 16px;background:linear-gradient(180deg,#1A1A1A,#111111);border-radius:13px;color:#F2F2F0;flex-wrap:wrap;}
.ce .sbar h2{margin:0;font-size:20.5px;font-weight:800;letter-spacing:-.5px;}
.ce .sbar-t{display:flex;gap:4px;flex-wrap:wrap;}

/* ---- 기부 ---- */
.ce .hero{position:relative;display:flex;align-items:center;gap:15px;padding:16px 20px;overflow:hidden;background:linear-gradient(105deg,#1A1206 0%,#3A2A0C 45%,#5C420F 100%);color:#F3EEE5;border-top:1px solid #C9D8EA;}
.ce .hero-rays{position:absolute;inset:-60% -20%;background:repeating-conic-gradient(from 0deg at 22% 50%,rgba(200,162,74,.16) 0deg 5deg,transparent 5deg 13deg);pointer-events:none;}
.ce .hero-medal{position:relative;font-size:42.4px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
.ce .hero-txt{position:relative;}
.ce .hero-lb{font-size:13px;letter-spacing:3px;font-weight:800;color:#C9AD80;}
.ce .hero-nm{font-size:30.7px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin:2px 0 3px;background:linear-gradient(180deg,#FFF6DC 20%,#D8AF4E 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 10px rgba(200,162,74,.25);}
.ce .hero-sub{font-size:14.5px;color:#C4B48C;}
.ce .hero-badge{position:relative;margin-left:auto;text-align:right;border-left:1px solid rgba(200,162,74,.35);padding-left:16px;}
.ce .hero-badge em{display:block;font-style:normal;font-size:12.5px;letter-spacing:1.4px;color:#C4B48C;font-weight:800;}
.ce .hero-badge b{font-size:21.5px;color:var(--gold);font-variant-numeric:tabular-nums;}
.ce .dongrid{display:grid;grid-template-columns:1fr 1.25fr;gap:1px;background:var(--line2);border-top:1px solid var(--line2);}
.ce .donbox{background:var(--card);}
.ce .donhd{font-size:13px;letter-spacing:1.4px;font-weight:800;color:var(--mut);padding:11px 14px 7px;}
.ce .donbox .stbl{min-width:0;}

/* ---- 정책 집행 ---- */
.ce .policy .picks{padding:12px 16px 14px;}
.ce .picks-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.ce .picks-hd .btn{margin-left:0;}
.ce .picks-hd .eyebrow{margin-right:auto;}

/* ---- 밸류에이션 ---- */
.ce .vsep2{width:1px;align-self:stretch;background:var(--line);margin:0 4px;min-height:38px;}
.ce .divbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:12px 16px;background:#EEF3F9;border-top:1px solid #C9D8EA;border-bottom:1px solid #C9D8EA;}
.ce .divlb{font-size:15px;font-weight:800;color:#2A5BA7;margin-bottom:2px;}
.ce .divbar .hint{max-width:280px;}
.ce .divbar .fld{color:#2A5BA7;}
.ce .ptag{display:inline-block;font-size:12px;font-weight:800;border-radius:5px;padding:1.5px 6px;margin-right:6px;letter-spacing:.4px;}
.ce .ptag.d{background:#F3EEE5;color:#6A5333;border:1px solid #D9CBB2;}
.ce .ptag.b{background:#E0E9FC;color:#2A4699;border:1px solid #A5B9F0;}
.ce .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border-top:1px solid var(--line2);}
.ce .metric{background:var(--card);padding:12px 14px;}
.ce .metric em{display:block;font-style:normal;font-size:12.5px;letter-spacing:1.2px;color:var(--mut);font-weight:800;margin-bottom:4px;}
.ce .metric b{display:block;font-size:18.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px;}
.ce .metric span{display:block;font-size:12.5px;color:#B0B0AE;margin-top:3px;}
.ce .vhint{margin:0;padding:11px 15px;font-size:14.5px;line-height:1.7;color:#444444;background:#F0F0EE;border-top:1px solid var(--line2);}

@media(max-width:860px){
  .ce .obwrap{grid-template-columns:1fr;}
  .ce .metrics{grid-template-columns:1fr 1fr;}
  .ce .dongrid{grid-template-columns:1fr;}
  .ce .mover-row{grid-template-columns:1fr;}
  .ce .hero-nm{font-size:24.5px;}
  .ce .specs{grid-template-columns:1fr 1fr;}
  .ce .wi-grid{grid-template-columns:1fr;}
  .ce .wi-block+.wi-block{border-left:0;border-top:1px solid var(--line2);}
}

@media(max-width:860px){
  .ce .menus{grid-template-columns:1fr 1fr;}
  .ce .rates-bd{grid-template-columns:1fr;}
  .ce .vault-r{margin-left:0;}
  .ce .ai-cols{grid-template-columns:1fr;}
}
.ce .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.ce .seg button{flex:1;border:0;background:#fff;padding:9px;font-size:15.5px;font-weight:800;cursor:pointer;color:var(--mut);}
.ce .seg button.on.in{background:var(--in);color:#fff;}
.ce .seg button.on.out{background:var(--out);color:#fff;}

@media(max-width:860px){
  .ce .grid2{grid-template-columns:1fr;}
  .ce .split{grid-template-columns:1fr;}
  .ce .vtabs{display:flex;gap:5px;overflow-x:auto;max-height:none;}
  .ce .vtab{width:auto;white-space:nowrap;}
  .ce .vtab .vsum{display:none;}
  .ce .wrap{padding:14px 13px 80px;}
  .ce .cover{padding:13px 14px 0;}
  .ce .weekbar{padding:8px 13px;}
}
/* ==== 리서치 리포트 테마 ====
   흰 지면 + 검은 표제 블록(오른쪽 아래만 둥글게) + 브론즈 강조 + 회색 머리줄 표 + Fig. 번호 표제 */
.ce{
  --ink:#111111; --gold:#A0845C; --gold-d:#7B6342; --gold-l:#C9AD80;
  --paper:#F2F1EE; --card:#FFFFFF; --line:#C8C8C6; --line2:#E3E3E1;
  --txt:#1A1A1A; --mut:#6D6D6B; --rule:#8C8C8A; --th:#E4E4E2; --hl:#DCE7F3; --navy:#2A5BA7;
  --up:#D2253F; --dn:#1F5ED6; --upbg:#FDEDF0; --dnbg:#EAF2FD; --upbar:rgba(210,37,63,.10); --dnbar:rgba(31,94,214,.10);
  font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--paper); color:var(--txt);
}
.ce .up{color:var(--up)!important;}
.ce .dn{color:var(--dn)!important;}
.ce .eq{color:var(--txt);}
.ce .num,.ce .num *{font-variant-numeric:tabular-nums;}

/* 표지 */
.ce .cover{background:#fff;color:var(--txt);padding:0 20px;box-shadow:0 2px 0 var(--gold),0 6px 14px rgba(0,0,0,.06);}
.ce .cover-top{align-items:flex-end;gap:18px;}
.ce .brand{align-items:flex-end;gap:18px;}
.ce .seal{width:auto;height:auto;border:0;border-radius:0 0 24px 0;background:#141414;color:var(--gold-l);
  padding:18px 22px 12px;display:flex;flex-direction:column;align-items:flex-start;letter-spacing:0;align-self:flex-start;}
.ce .seal b{font-size:15px;font-weight:800;letter-spacing:.4px;}
.ce .seal span{font-size:12px;color:#D8D8D6;font-weight:500;margin-top:3px;}
.ce .brand h1{font-size:26px;letter-spacing:-.8px;color:#111;padding-top:14px;}
.ce .brand p{color:var(--gold);font-size:14px;letter-spacing:0;font-weight:600;margin-top:3px;}
.ce .cover-meta span{color:var(--mut)!important;}
.ce .cover-meta span:last-child{color:#111!important;}
.ce .cover-meta .roomtag{background:#141414;border:0;color:var(--gold-l)!important;border-radius:0 0 10px 0;}
.ce .tabs{margin-top:12px;}
.ce .tab{color:#6D6D6B;}
.ce .tab:hover{color:#111;}
.ce .tab.on{color:#111;border-bottom-color:var(--gold);}
.ce .tab .tno{color:var(--gold);}

.ce .weekbar{background:#ECECEA;border-bottom:1px solid var(--line);}
.ce .wk-btn,.ce .wk-date{border-radius:2px;}
.ce .wk-btn:hover{background:#141414;border-color:#141414;}

/* 카드 → 리포트 Fig. 블록 */
.ce .wrap{counter-reset:fig;}
.ce .card,.ce .book,.ce .wi,.ce .ai,.ce .chart,.ce .vtabs,.ce .scard{border:0;border-radius:0;box-shadow:0 0 0 1px var(--line2);background:var(--card);}
.ce .card-hd{border-bottom:2px solid var(--rule);padding:13px 16px 9px;}
.ce .card-hd h2{font-size:16.5px;letter-spacing:-.3px;}
.ce .card-hd h2::before{counter-increment:fig;content:"Fig. " counter(fig) ":";font-style:italic;font-weight:800;margin-right:9px;letter-spacing:-.4px;color:#111;}
.ce .eyebrow{color:var(--gold-d);letter-spacing:.4px;}
.ce .hint{color:var(--mut);}
.ce .empty{color:var(--mut);}

/* 검은 표제 블록 */
.ce .paybar,.ce .rates,.ce .vault,.ce .rooms,.ce .sbar,.ce .star{background:#151515;border:0;border-radius:0 0 22px 0;color:#F2F2F0;}
.ce .book-hd{background:#151515;}
.ce .vault-num,.ce .book-hd .bal b,.ce .rooms-num,.ce .star-pt,.ce .rate-i span,.ce .taxset span,.ce .vault-seal{color:var(--gold-l);}
.ce .vault-seal{border-color:var(--gold-l);border-radius:0 0 12px 0;}
.ce .rate{border-radius:0;border-color:#3A3A3A;background:rgba(255,255,255,.05);}
.ce .rates-hd .ai-tag{background:var(--gold);color:#fff;}
.ce .ai{background:var(--card);}
.ce .ai-tag{background:#141414;border-radius:0 0 6px 0;}
.ce .ai-quote{border-left-color:var(--gold);}
.ce .ai-box{border-radius:0;}
.ce .rooms-code{background:rgba(160,132,92,.16);border-top-color:rgba(160,132,92,.45);}
.ce .rooms-go{border-top-color:#2A2A2A;}

/* 표: 회색 머리줄 + 점선 행 + 강조 열 */
.ce table.led th,.ce .stbl th,.ce .ptbl th,.ce table.mtbl th{background:var(--th);color:#333;letter-spacing:0;font-weight:700;font-size:13.5px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.ce table.led td,.ce .stbl td,.ce .ptbl td,.ce table.mtbl td{border-bottom:1px dotted #BDBDBB;}
.ce .stbl .fin,.ce table.led .cbal{background:var(--hl);border-left:0;color:#0E2A55;}
.ce .stbl tr:hover td{background:#F7F7F5;}
.ce .stbl tr:hover td.fin{background:#D2E0F0;}

/* 버튼 · 입력 */
.ce .btn{border-radius:2px;border-color:var(--line);}
.ce .btn:hover{border-color:#111;}
.ce .btn.pri{background:#141414;border-color:#141414;color:#fff;}
.ce .btn.pri:hover{background:#000;}
.ce .btn.gold{background:var(--gold);color:#fff;border-color:var(--gold-d);}
.ce .btn.gold:hover{background:var(--gold-d);}
.ce .btn.buyb{background:var(--up);border-color:var(--up);color:#fff;}
.ce .btn.sellb{background:var(--dn);border-color:var(--dn);color:#fff;}
.ce .btn:focus-visible,.ce .qbtn:focus-visible,.ce .ob-p:focus-visible,.ce .hs:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.ce .inp{border-radius:2px;}
.ce .inp:focus{outline-color:var(--gold);border-color:var(--gold);}
.ce .seg{border-radius:2px;}
.ce .seg button.on.buy{background:var(--up);color:#fff;}
.ce .seg button.on.sell{background:var(--dn);color:#fff;}
.ce .bt{border-radius:2px;}
.ce .bt.on{background:#141414;border-color:#141414;}
.ce .bmsg{border-radius:2px;}
.ce .pick,.ce .jchip,.ce .gchip,.ce .badge{border-radius:2px;}

/* 세로 탭 · 배너 · 카드 */

.ce .banner,.ce .divbar{border-radius:0;background:var(--hl);border:0;border-left:4px solid var(--navy);}
.ce .scard{border-top:3px solid #141414;}
.ce .scard.on{box-shadow:0 0 0 2px var(--gold);}
.ce .total{border-top:2px solid var(--rule);}
.ce .modal{border-radius:0;}
.ce .modal-hd{border-bottom:2px solid var(--rule);}
.ce .photo,.ce .rrow,.ce .item,.ce .mchip{border-radius:2px;}
.ce .specs,.ce .metrics{background:var(--line2);}
.ce .purpose,.ce .vhint{background:#F5F5F3;color:#444;}

/* ===== 종목 현재가 머리 (MTS 형식) ===== */
.ce .mcol{min-width:0;}
.ce .qh{background:var(--card);box-shadow:0 0 0 1px var(--line2);padding:16px 18px 13px;}
.ce .qh-top{display:flex;gap:14px;align-items:center;}
.ce .qh-logo{width:54px;height:54px;border-radius:50%;background:#141414;color:var(--gold-l);display:grid;place-items:center;font-size:23px;font-weight:800;flex:none;}
.ce .qh-id{min-width:0;}
.ce .qh-name{margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.25;}
.ce .qh-mkt{font-size:14px;color:var(--mut);margin-top:2px;}
.ce .qh-mkt i{display:inline-block;width:1px;height:12px;background:var(--line);margin:0 8px;vertical-align:-1px;}
.ce .qh-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.ce .qh-tags span{border:1px solid var(--line);border-radius:7px;padding:2px 9px;font-size:12.5px;font-weight:600;color:#333;}
.ce .qh-tags span.mt{border-color:var(--gold);color:var(--gold-d);}
.ce .qh-row{display:flex;align-items:flex-end;gap:14px;margin-top:14px;flex-wrap:wrap;}
.ce .qh-px b{display:block;font-size:42px;font-weight:800;letter-spacing:-1.6px;line-height:1;}
.ce .qh-px span{display:flex;gap:22px;font-size:16.5px;font-weight:600;margin-top:7px;}
.ce .qh-px em{font-style:normal;}
.ce .qh-btns{margin-left:auto;display:flex;gap:8px;}
.ce .qbtn{border:0;border-radius:8px;color:#fff;font-family:inherit;font-size:18px;font-weight:800;width:104px;height:52px;cursor:pointer;}
.ce .qbtn.buy{background:var(--up);}
.ce .qbtn.sell{background:var(--dn);}
.ce .qbtn:hover{filter:brightness(.93);}
.ce .qbtn:disabled{opacity:.4;cursor:not-allowed;}
.ce .qh-prev{font-size:12.5px;color:var(--mut);margin-top:9px;}

/* ===== 호가창 (MTS 형식) ===== */
.ce .ob2{margin-top:14px;background:var(--card);box-shadow:0 0 0 1px var(--line2);}
.ce .ob2-hd,.ce .ob2-grid,.ce .ob2-sum{display:grid;grid-template-columns:1fr 1.35fr 1fr;}
.ce .ob2-hd{border-bottom:2px solid var(--rule);font-size:12.5px;color:var(--mut);font-weight:700;text-align:center;padding:8px 0;}
.ce .ob2-grid{grid-template-rows:repeat(10,48px);}
.ce .ob-q{display:flex;align-items:center;justify-content:flex-end;padding:0 12px;border-bottom:1px solid var(--line2);font-size:17.5px;color:#222;}
.ce .ob-q.ask{background:linear-gradient(to left,var(--dnbar) var(--w),transparent var(--w));}
.ce .ob-q.bid{background:linear-gradient(to right,var(--upbar) var(--w),transparent var(--w));}
.ce .ob-p{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;border:0;border-bottom:1px solid #fff;
  font-family:inherit;color:inherit;cursor:pointer;width:100%;min-width:0;}
.ce .ob-p.ask{background:var(--dnbg);}
.ce .ob-p.bid{background:var(--upbg);}
.ce .ob-p b{font-size:19px;font-weight:800;letter-spacing:-.4px;}
.ce .ob-p span{font-size:13px;font-weight:500;}
.ce .ob-p.cur{box-shadow:inset 0 0 0 2px #111;}
.ce .ob-p:not(.blank):hover{filter:brightness(.96);}
.ce .ob-p.blank{cursor:default;}
.ce .ob-info,.ce .ob-tape{padding:8px 12px;font-size:13px;overflow:hidden;border-bottom:1px solid var(--line2);min-width:0;}
.ce .ob-kv{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;}
.ce .ob-kv em{font-style:normal;color:var(--mut);}
.ce .ob-kv b{font-weight:700;}
.ce .ob-tape-hd{font-size:12.5px;color:var(--mut);font-weight:700;margin-bottom:3px;}
.ce .ob-none{color:var(--mut);padding-top:6px;}
.ce .ob2-sum{background:#ECECEA;border-top:1px solid var(--line);align-items:center;height:46px;font-size:17px;}
.ce .ob2-sum b{text-align:right;padding:0 12px;font-weight:700;}
.ce .ob2-sum span{text-align:center;font-weight:800;background:#fff;height:100%;display:grid;place-items:center;border-left:1px solid var(--line);border-right:1px solid var(--line);}

/* ===== 주문 · 미체결 ===== */
.ce .ordf-bd{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 16px;}
.ce .stag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:2px;color:#fff;}
.ce .stag.buy{background:var(--up);}
.ce .stag.sell{background:var(--dn);}

/* ===== 보유내역 (MTS 잔고 형식) ===== */
.ce .htbl{width:100%;border-collapse:collapse;min-width:360px;}
.ce .htbl th{background:#F3F3F1;font-weight:600;font-size:14.5px;color:#444;padding:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);}
.ce .htbl thead tr:last-child th{border-bottom:1px solid var(--line);}
.ce .htbl th:last-child,.ce .htbl td:last-child{border-right:0;}
.ce .hs,.ce .hs-static{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:9px 10px;background:none;border:0;font:inherit;color:inherit;}
.ce .hs{cursor:pointer;}
.ce .hs:hover{color:#111;}
.ce .hs i{display:inline-flex;flex-direction:column;gap:2px;}
.ce .hs i::before{content:"";border:5px solid transparent;border-bottom:6px solid #B5B5B3;border-top:0;}
.ce .hs i::after{content:"";border:5px solid transparent;border-top:6px solid #B5B5B3;border-bottom:0;}
.ce .hs.on.asc i::before{border-bottom-color:#111;}
.ce .hs.on.desc i::after{border-top-color:#111;}
.ce .htbl td{padding:13px 14px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);vertical-align:middle;}
.ce .htbl td.r{text-align:right;}
.ce .htbl .l1{font-size:17px;font-weight:600;line-height:1.35;color:#222;}
.ce .htbl .l2{font-size:15.5px;line-height:1.35;color:#555;font-weight:600;margin-top:5px;}
.ce .htbl td:first-child .l1{font-weight:600;}
.ce .htbl small{font-size:13px;margin-left:2px;color:var(--mut);font-weight:500;}

@media(max-width:560px){
  .ce .seal{padding:14px 14px 10px;}
  .ce .brand h1{font-size:20px;}
  .ce .qh-px b{font-size:34px;}
  .ce .qh-btns{margin-left:0;width:100%;}
  .ce .qbtn{flex:1;}
  .ce .ob2-grid{grid-template-rows:repeat(10,46px);}
  .ce .ob-p{flex-direction:column;justify-content:center;align-items:center;gap:0;}
  .ce .ob-p b{font-size:16px;}
  .ce .ob-p span{font-size:11.5px;}
  .ce .ob-q{font-size:14.5px;padding:0 8px;}
  .ce .ob-info,.ce .ob-tape{font-size:11.5px;padding:6px 8px;}
  .ce .ob-kv{padding:1.5px 0;}
  .ce .htbl .l1{font-size:15px;}
  .ce .htbl .l2{font-size:13.5px;}
  .ce .htbl td{padding:11px 10px;}
}

/* ===== 관리자 ===== */
.ce .adm-lock{max-width:460px;margin:28px auto;background:var(--card);box-shadow:0 0 0 1px var(--line2);}
.ce .adm-lock-hd{background:#151515;color:#F2F2F0;padding:22px 24px 18px;border-radius:0 0 22px 0;}
.ce .adm-lock-hd b,.ce .adm-bar b{display:block;color:var(--gold-l);font-size:12.5px;letter-spacing:1.2px;font-weight:800;}
.ce .adm-lock-hd h2{margin:6px 0 4px;font-size:22px;letter-spacing:-.5px;}
.ce .adm-lock-hd p{margin:0;font-size:14px;color:#BDBDBB;line-height:1.6;}
.ce .adm-lock-bd{padding:20px 24px 24px;display:grid;gap:12px;}
.ce .adm-err{color:var(--up);font-size:14px;font-weight:600;}
.ce .adm-bar{background:#151515;color:#F2F2F0;border-radius:0 0 22px 0;padding:16px 20px;margin-bottom:14px;}
.ce .adm-bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ce .adm-bar h2{margin:3px 0 0;font-size:20px;letter-spacing:-.4px;}

.ce .rk{display:inline-grid;place-items:center;width:28px;height:28px;font-weight:800;border-radius:0 0 8px 0;background:#ECECEA;font-variant-numeric:tabular-nums;}
.ce .rk.top{background:#141414;color:var(--gold-l);}
.ce .rk-job{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px;}
.ce .rk-bar{height:4px;background:rgba(0,0,0,.08);margin-top:5px;}
.ce .rk-bar i{display:block;height:100%;background:var(--gold);}
.ce .rk-sum{display:flex;gap:20px;text-align:right;}
.ce .rk-sum em{display:block;font-style:normal;font-size:12px;color:var(--mut);font-weight:700;}
.ce .rk-sum b{font-size:16px;font-weight:800;}
.ce .pxq{display:flex;gap:4px;}
.ce .pxq .btn{padding:3px 7px;font-size:13px;}
/* ===== 첫 화면 ===== */
.ce .gate-lead{margin:4px 0 16px;font-size:15.5px;color:var(--mut);font-weight:500;}
.ce .gate-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start;}

.ce .jg .adm-lock-hd p{color:#D6E2F2;}

.ce .jg-job{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;color:inherit;border-radius:0 0 12px 0;min-width:0;}

.ce .jg-job.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:#F4F8FD;}
.ce .jg-nm{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:6px;}

.ce .jg-who{font-size:13px;color:#444;font-weight:600;overflow-wrap:anywhere;}

.ce .jg-pin{padding:0 20px 20px;}
.ce .jg-pin-row{display:flex;gap:8px;}

/* ===== 접속 표시 · 미리보기 · 보기 전용 ===== */
.ce .who{display:inline-flex;align-items:center;gap:8px;}
.ce .who-chip{background:#141414;color:var(--gold-l);font-size:13px;font-weight:800;padding:4px 10px;border-radius:0 0 8px 0;}

.ce .pvstrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold);color:#fff;padding:9px 20px;font-size:14px;font-weight:600;}

.ce .ro-note{display:flex;gap:10px;align-items:center;background:var(--hl);border-left:4px solid var(--navy);padding:10px 14px;margin-bottom:14px;font-size:14.5px;color:#0E2A55;font-weight:600;}

.ce main.ro :is(input:not([type=range]):not([type=checkbox]),select,textarea){pointer-events:none;background:#F0F0EE!important;color:#6D6D6B;}

.ce main.ro .law-edit{display:none;}
.ce .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#141414;color:#fff;padding:11px 18px;font-size:14.5px;font-weight:600;z-index:200;border-radius:0 0 12px 0;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:calc(100% - 32px);}

.ce .jg-who-pick{margin-bottom:10px;}

  /* ========== 운영자 정보 · 법적 고지 ========== */
  const OP_KEY = "class-econ-operator";
  const OP_DEFAULT = { name: "온투", owner: "", phone: "", email: "", effective: "2026년 10월 21일" };
  const loadOperator = async () => {
    if (window.__ceRemote) {
      const r = await api("reg/operator", {});
      return { ...OP_DEFAULT, ...(r.ok ? r.operator || {} : {}) };
    }
    return { ...OP_DEFAULT, ...(await readJSON(OP_KEY) || {}) };
  };
  const saveOperator = async (op, sysTok) => {
    if (window.__ceRemote) return api("sys/operator", { operator: op }, sysTok);
    await writeJSON(OP_KEY, op);
    return { ok: true };
  };
  function OperatorForm({ sysTok, onSaved }) {
    const [op, setOp] = useState(null);
    const [msg, setMsg] = useState("");
    useEffect(() => { loadOperator().then(setOp); }, []);
    if (!op) return null;
    const F = (k, label, ph) => E("div", null, E("label", { className: "fld", htmlFor: "op-" + k }, label), E("input", { id: "op-" + k, className: "inp mini", placeholder: ph || "", value: op[k] || "", onChange: (e) => setOp({ ...op, [k]: e.target.value }) }));
    return E("form", { className: "op-form", onSubmit: async (e) => {
      e.preventDefault();
      const r = await saveOperator(op, sysTok);
      setMsg(r.ok ? "저장했습니다. 맨 아래 개인정보 처리방침에 바로 반영됩니다." : r.error);
      onSaved && onSaved();
    } },
      E("h3", { className: "sys-h3" }, "운영자 정보 · 개인정보 보호책임자"),
      E("p", { className: "hint", style: { margin: "0 0 8px" } }, "개인정보 처리방침에 표시됩니다. 법에 따라 개인정보 보호책임자의 이름(또는 담당 부서)과 연락처를 꼭 적어야 합니다."),
      E("div", { className: "op-grid" },
        F("name", "운영자 이름", "예) 온투"),
        F("owner", "개인정보 보호책임자", "예) 홍길동 (운영 담당)"),
        F("phone", "전화번호", "예) 010-0000-0000"),
        F("email", "이메일", "예) ontu@example.com"),
        F("effective", "처리방침 시행일", "예) 2026년 10월 21일")),
      E("div", { className: "sys-pw-row", style: { marginTop: 8 } }, E("button", { className: "btn sm pri", type: "submit" }, "운영자 정보 저장"), msg && E("span", { className: "hint" }, msg)));
  }

  const DOCS = [
    ["privacy", "개인정보 처리방침"],
    ["collect", "개인정보 수집·이용 안내"],
    ["consent", "보호자 동의서 양식"],
    ["terms", "이용 안내"]
  ];
  function SiteFooter({ onSys, sysOpen } = {}) {
    const [open, setOpen] = useState(null);
    const [op, setOp] = useState(OP_DEFAULT);
    useEffect(() => { loadOperator().then(setOp).catch(() => {}); }, [open]);
    return E("footer", { className: "site-foot" },
      E("nav", { className: "site-links", "aria-label": "법적 고지" },
        DOCS.map(([k, label]) => E("button", { key: k, className: k === "privacy" ? "strong" : "", onClick: () => setOpen(k) }, label)),
        onSys && E("button", { className: "dim", onClick: onSys }, sysOpen ? "시스템 관리 닫기" : "시스템 관리")),
      E("div", { className: "site-copy" },
        E("img", { src: LOGO_SM, alt: "", width: 22, height: 22 }),
        E("span", null, "우리 반 경제 교실 · copyright by ", E("b", null, op.name || "온투"))),
      open && E(DocView, { k: open, op, onClose: () => setOpen(null), onSwitch: setOpen }));
  }
  function DocView({ k, op, onClose, onSwitch }) {
    const host = useMemo(() => {
      const d = document.createElement("div");
      d.className = "ce ce-doc-portal";
      return d;
    }, []);
    useEffect(() => {
      document.body.appendChild(host);
      return () => { try { document.body.removeChild(host); } catch (e) {} };
    }, []);
    useEffect(() => {
      const h = (e) => e.key === "Escape" && onClose();
      window.addEventListener("keydown", h);
      document.documentElement.classList.add("ce-doc-open");
      return () => {
        window.removeEventListener("keydown", h);
        document.documentElement.classList.remove("ce-doc-open");
      };
    }, []);
    const title = (DOCS.find((d) => d[0] === k) || [])[1];
    const body = k === "privacy" ? E(PrivacyDoc, { op }) : k === "collect" ? E(CollectDoc, { op }) : k === "consent" ? E(ConsentDoc, { op }) : E(TermsDoc, { op });
    return ReactDOM.createPortal(E("div", { className: "doc-ov", role: "dialog", "aria-modal": "true", "aria-label": title },
      E("div", { className: "pr-bar doc-bar" },
        E("div", { className: "pr-bar-l" }, E("b", null, title), E("span", null, "우리 반 경제 교실 · ", op.name || "온투")),
        E("div", { className: "doc-tabs" }, DOCS.map(([kk, l]) => E("button", { key: kk, className: kk === k ? "on" : "", onClick: () => onSwitch(kk) }, l))),
        E("div", { className: "pr-btns" },
          E("button", { className: "btn", onClick: onClose }, "닫기"),
          E("button", { className: "btn pri", onClick: () => { try { window.print(); } catch (e) {} } }, "인쇄하기"))),
      E("article", { className: "pr-sheet doc-sheet" },
        E(PrHead, { title, sub: `우리 반 경제 교실 · 운영 ${op.name || "온투"}`, meta: k === "consent" ? [] : [["시행일", op.effective || "—"]] }),
        body,
        E("footer", { className: "pr-foot" }, E("span", null, "우리 반 경제 교실 · copyright by ", op.name || "온투"), E("span", null, "시행일 ", op.effective || "—")))), host);
  }
  const H = (t) => E("h2", { className: "pr-h2" }, t);

      P("FREE는 학급 교육 활동 안에서만 쓰는 가상의 화폐이며 실제 돈이나 상품과 바꿀 수 없습니다. 모의 주식·채권도 실제 금융 상품이 아닙니다."),
      H("3. 비밀번호 관리"),
      UL(["선생님 비밀번호는 학생에게 알려 주지 않습니다.", "학생은 처음 들어올 때 숫자 4자리 비밀번호를 직접 정하고, 친구에게 알려 주지 않습니다. 다른 사람의 비밀번호로 들어가면 안 됩니다. 잊으면 선생님이 확인하거나 바꿔 줍니다.", "학교 공용 패드에서는 사용이 끝나면 '나가기'를 누르고, 선생님은 수업이 끝나면 '수업 끝'을 누릅니다."]),
      H("4. 하면 안 되는 일"),
      UL(["다른 사람인 척 로그인하거나 기록을 몰래 바꾸는 일", "서비스를 일부러 멈추게 하거나 고장 내려는 일", "다른 학생의 개인정보를 학급 밖으로 퍼뜨리는 일"]),
      P("모든 변경은 누가 했는지 활동 기록에 남으며, 선생님이 되돌릴 수 있습니다."),
      H("5. 기록 보관"),
      P("서비스는 무료로 제공되며, 서버 장애 등으로 기록이 손상될 가능성을 완전히 없앨 수는 없습니다. 선생님은 관리자 화면의 '자료 옮기기 → 파일로 저장'으로 정기적으로 백업해 주세요."),
      H("6. 서비스의 변경과 중단"),
      P("운영자는 더 나은 서비스를 위해 기능을 바꿀 수 있으며, 서비스를 중단해야 할 때에는 미리 알리고 자료를 내려받을 시간을 드립니다."),
      H("7. 문의"),
      P("개인정보 보호책임자 ", blank(op.owner, "(미정)"), " · ", blank(op.phone, "(전화 미정)"), " · ", blank(op.email, "(이메일 미정)")));
  }
  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem((shared ? "s:" : "p:") + key);
      if (v === null) throw new Error("not found");
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem((shared ? "s:" : "p:") + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem((shared ? "s:" : "p:") + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix = "", shared) {
      const pre = (shared ? "s:" : "p:") + prefix;
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(pre)) keys.push(k.slice(2));
      }
      return { keys, prefix, shared: !!shared };
    }
  };
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
})();
</script>
